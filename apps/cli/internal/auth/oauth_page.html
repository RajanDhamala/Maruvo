<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Status}} · Maruvo</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: #fafaf8;
      --text: #202020;
      --muted: #666;
      --border: #deded9;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 24px;
      background: var(--background);
      color: var(--text);
    }
    main { width: 100%; max-width: 480px; }
    header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 20px;
      font: 600 14px ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: .12em;
    }
    section { padding: 36px 0; }
    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 14px;
    }
    svg { width: 20px; height: 20px; flex-shrink: 0; }
    h1 {
      margin: 20px 0 16px;
      font-size: 32px;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: -.025em;
    }
    p { margin: 0; font-size: 16px; line-height: 1.65; color: var(--muted); }
    footer {
      border-top: 1px solid var(--border);
      padding-top: 20px;
      color: var(--muted);
      font-size: 13px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --background: #161616;
        --text: #ededeb;
        --muted: #a3a3a0;
        --border: #353534;
      }
    }
    @media (max-width: 480px) {
      h1 { font-size: 28px; }
    }
  </style>
</head>
<body>
  <main>
    <header>MARUVO</header>
    <section aria-labelledby="heading">
      <div class="status">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9" />
          {{if .Failed}}<path d="M12 7v6m0 4h.01" />{{else}}<path d="m8 12 3 3 5-6" />{{end}}
        </svg>
        <span>{{.Status}}</span>
      </div>
      <h1 id="heading">{{.Heading}}</h1>
      <p>{{.Message}}</p>
    </section>
    <footer>You can close this tab.</footer>
  </main>
</body>
</html>
