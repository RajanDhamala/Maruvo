
syntax = "proto3";

package rpc;

option go_package = "github.com/rajandhamala/Maruvo/pb;pb";

message HelloRequest {
    string name = 1;
    int32 age = 2;
}

message HelloResponse {
    bool isEligible = 1;
}

message LogRequest {
    string msg = 1;
    string ip = 2;
}

message LogResponse {
    bool ack = 1;
}

service HelloService {
    rpc sayHello (HelloRequest) returns (HelloResponse);
    rpc sendLogs (LogRequest) returns (LogResponse);
}

