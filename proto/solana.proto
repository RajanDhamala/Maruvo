
// currently demo just for testing
syntax = "proto3";

package maruvo;

option go_package = "github.com/rajandhamala/Maruvo/pb;pb";

service SolanaService {
    rpc Health (HealthRequest) returns (HealthResponse);
    rpc Demo (DemoRequest) returns (DemoResponse);
}

message HealthRequest {}

message HealthResponse {
    string message = 1;
}

message DemoRequest {
    string message = 1;
}

message DemoResponse {
    string message = 1;
    string service = 2;
}
