name: Build checks

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

concurrency:
  group: builds-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: |
            apps/api/go.sum
            apps/cli/go.sum

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: "22.22.0"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Build website
        run: make build-web

      - name: Build frontend (Bubble Tea CLI)
        run: make build-cli

      - name: Build Go API
        run: make build-api

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Build Rust service
        run: make build-rust
